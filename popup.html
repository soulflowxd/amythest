<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amythest</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="liquid-glass.css"><link rel="stylesheet" href="aero.css"></head><body class="popup" data-loading="true"><main class="shell"><header class="topbar"><div class="brand"><img class="gem" src="icons/mark-clear.svg" alt=""><span>amythest</span></div><button class="dashboard-link" id="dashboard" type="button" aria-label="Open dashboard"><span>Dashboard</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4"/></svg></button></header><section class="hero"><div><div class="eyebrow">YOUR SPACE TO FOCUS</div><h1>Make room for<br><em>what matters.</em></h1><p>Less scrolling. More living.</p></div><div class="avatar-stage"><amythest-avatar id="avatar" aria-label="Amythest companion"></amythest-avatar></div></section><section class="focus-card"><div class="card-heading"><span><strong id="focus-title">Ready to focus?</strong><small id="focus-subtitle">A little intention goes a long way.</small></span></div><div class="timer" id="timer">25:00</div><div class="timer-caption" id="timer-caption">MINUTE FOCUS SESSION</div><button class="primary-button" id="focus-button">Start focus session <span>→</span></button></section><section class="today"><div class="section-title"><h2>Today at a glance</h2><span id="today-date"></span></div><div class="metrics"><div><strong id="total-time">0m</strong><span>screen time</span></div><div><strong id="site-count">0</strong><span>sites visited</span></div></div><div class="distraction-caption" id="distraction-caption"></div><div class="usage-list" id="usage-list"></div></section><footer><span>Small moments add up.</span><button id="settings">Manage distractions →</button></footer></main><script src="amythest-avatar.js"></script><script src="distraction-usage.js"></script><script src="popup.js"></script></body></
